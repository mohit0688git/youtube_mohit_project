# The main pipeline for youtube_project_bundle

resources:
  pipelines:
    bronze_silver_earthquake_etl:
      name: bronze_silver_earthquake_prod
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/DLT_Pipelines/bronze_silver/transformations/**
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      run_as:
        service_principal_name: ${var.spn_id}
      root_path: ../src/DLT_Pipelines/bronze_silver




# This is a Declarative Automation Bundle definition for youtube_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: youtube_project_bundle
  uuid: 09b3cf9a-830f-4bdb-b868-c9eae147551b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: The warehouse to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8364a065-993c.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
      warehouse_id: 75cc6c9a51b7b1ef
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-8364a065-993c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mohit.databricks0688@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/PROD_youtube_mohit_project
    variables:
      catalog: youtube_prod
      schema: prod
      warehouse_id: 75cc6c9a51b7b1ef
    permissions:
      - user_name: mohit.databricks0688@gmail.com
        level: CAN_MANAGE
